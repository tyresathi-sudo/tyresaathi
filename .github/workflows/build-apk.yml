name: Build TyreSaathi Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android
        env:
          CI: true
          CAPACITOR_TELEMETRY: false

      - name: Verify Permanent Signing Keystore
        run: |
          if [ ! -f "android/app/release.keystore" ]; then
            echo "Generating fallback keystore..."
            keytool -genkey -v -keystore android/app/release.keystore -alias tyresaathi -keyalg RSA -keysize 2048 -validity 10000 -storepass tyresaathi123 -keypass tyresaathi123 -dname "CN=TyreSaathi, OU=App, O=TyreSaathi, L=Delhi, S=Delhi, C=IN" -noprompt
          else
            echo "Permanent release.keystore found!"
            ls -la android/app/release.keystore
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK (Release & Debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Prepare APK Outputs
        run: |
          mkdir -p output-apks
          find android/app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} output-apks/ \;
          # Ensure exact TyreSaathi.apk file exists for direct download link
          find output-apks/ -name "*release*.apk" -exec cp {} output-apks/TyreSaathi.apk \;
          ls -la output-apks/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TyreSaathi-APK-Package
          path: output-apks/*.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2
          name: "TyreSaathi Android App v1.2 (Official Release)"
          body: |
            ⚡ TyreSaathi Official Android APK Release
            - ⭐ Real-Time Customer Star Rating & Review System
            - 🔔 Live In-App & Push Notification Hub
            - 🚀 Automatic App Update & Auto-Replace System (with Skip option)
            - 📍 Nearest Tyre Hubs & Turn-by-Turn GPS Direction Routing
            - 📊 Private Store Analytics & Live Customer Insights
          draft: false
          prerelease: false
          files: output-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
